# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test · lint · docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (pinned by rust-toolchain.toml)
        run: rustup show
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy (all targets, warnings as errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (unit, integration, doctests)
        run: cargo test
      - name: Docs (warnings as errors)
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz-build:
    name: Fuzz harness build (nightly)
    runs-on: ubuntu-latest
    # The repo-root rust-toolchain.toml pins stable 1.96, which outranks
    # `rustup default`. RUSTUP_TOOLCHAIN forces nightly for every cargo/rustc in
    # this job (needed for -Zsanitizer=address) and outranks the toolchain file.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        # Install via cargo so the binary lands in $CARGO_HOME/bin, the directory
        # cargo always searches for external subcommands regardless of toolchain.
        # No --locked: cargo-fuzz's bundled lockfile pins dependencies (e.g.
        # rustix 0.36) too old to compile on a current nightly; letting cargo
        # resolve fresh, compiler-compatible versions avoids the build failure.
        run: cargo install cargo-fuzz
      - name: Build fuzz targets
        # Compile-only: ensures the fuzz harness does not bitrot. Actual fuzzing
        # runs happen out of band (cargo fuzz run validate).
        run: cargo fuzz build
