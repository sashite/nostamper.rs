[package]
name = "nostamper-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nostr = { version = "0.44", default-features = false, features = ["std"] }

[dependencies.nostamper]
path = ".."

# Keep some debug info for useful crash backtraces.
[profile.release]
debug = 1

[[bin]]
name = "validate"
path = "fuzz_targets/validate.rs"
test = false
doc = false
bench = false

# Standalone: the fuzz crate is not part of the published package's graph.
[workspace]
